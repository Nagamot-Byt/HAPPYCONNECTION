name: Desktop Build & Release

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build Linux packages
        run: ./scripts/build_linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medlink-linux
          path: |
            dist/Linux/*.run
            dist/Linux/*.tar.gz
            dist/Linux/*.deb
            dist/Linux/README*.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build Windows packages
        run: .\scripts\build_windows.bat
        shell: cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medlink-windows
          path: |
            dist/Windows/MedLinkConnect-Setup.exe
            dist/Windows/MedLinkConnect_Windows_Portable.zip
            dist/Windows/README_WINDOWS.txt
            dist/Windows/instalar_medlink_connect.bat
            dist/Windows/medlink_connect_admin.bat
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows ]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
          fail_on_unmatched_files: true

name: happyconnection
description: Medical RDP Connection Application

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Networking
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  
  # Security
  encrypt: ^4.0.0
  
  # UI
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # Network
  network_info_plus: ^4.0.0
  connectivity_plus: ^5.0.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
